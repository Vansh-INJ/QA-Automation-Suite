name: Daily API Health Check

on:
  schedule:
    - cron: '30 1 * * *'   # 01:30 UTC = 11:30 IST — adjust if your time changes
  workflow_dispatch: {}    # lets you trigger a manual run from the Actions tab

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API Health Suite (pushes results to n8n)
        env:
          BASE_URL: ${{ secrets.HEALTH_BASE_URL }}
          HEALTH_USER_USERNAME: ${{ secrets.HEALTH_USER_USERNAME }}
          HEALTH_USER_PASSWORD: ${{ secrets.HEALTH_USER_PASSWORD }}
          N8N_WEBHOOK_ENABLED: "true"
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          python run_health_check.py

      - name: Upload report + failure logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-health-report-${{ github.run_id }}
          path: |
            junit-health.xml
            **/api_health_report.xlsx
            **/api_failures/**
          retention-days: 30
