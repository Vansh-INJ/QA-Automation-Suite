name: Run API Health Suite

on:
  schedule:
  # ============================================================
  # DAYTIME COVERAGE — IST
  # GitHub Actions cron uses UTC
  # ============================================================

  - cron: '30 0 * * *'    # 06:00 AM IST
  - cron: '0 2 * * *'     # 07:30 AM IST
  - cron: '30 3 * * *'    # 09:00 AM IST
  - cron: '0 5 * * *'     # 10:30 AM IST
  - cron: '30 6 * * *'    # 12:00 PM IST
  - cron: '0 8 * * *'     # 01:30 PM IST
  - cron: '30 9 * * *'    # 03:00 PM IST
  - cron: '0 11 * * *'    # 04:30 PM IST
  - cron: '30 12 * * *'   # 06:00 PM IST
  - cron: '0 14 * * *'    # 07:30 PM IST

  # ============================================================
  # NIGHT / MIDNIGHT COVERAGE — IST
  # ============================================================

  - cron: '30 18 * * *'   # 12:00 AM IST
  - cron: '30 21 * * *'   # 03:00 AM IST

  # Manual execution
  workflow_dispatch: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API Health Suite
        env:
          HEALTH_BASE_URL: ${{ secrets.HEALTH_BASE_URL }}
          HEALTH_USER_USERNAME: ${{ secrets.HEALTH_USER_USERNAME }}
          HEALTH_USER_PASSWORD: ${{ secrets.HEALTH_USER_PASSWORD }}
          EMAIL_PROVIDER: "resend"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          HEALTH_MAIL_FROM: ${{ secrets.HEALTH_MAIL_FROM }}
          HEALTH_MAIL_TO: ${{ secrets.HEALTH_MAIL_TO }}
        run: |
          pytest test/health -q --junitxml=junit-health.xml
        continue-on-error: true

      - name: Upload report + failure logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-health-report-${{ github.run_id }}
          path: |
            junit-health.xml
            **/api_health_report.xlsx
            **/summary.json
            **/api_failures/**
          retention-days: 30