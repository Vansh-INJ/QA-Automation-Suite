name: API Health Check (20x Daily)

on:
  schedule:
    # 20 runs/day, approximately every 72 minutes.
    # All times are UTC.
    - cron: '0 0 * * *'     # 05:30 IST
    - cron: '12 1 * * *'    # 06:42 IST
    - cron: '24 2 * * *'    # 07:54 IST
    - cron: '36 3 * * *'    # 09:06 IST
    - cron: '48 4 * * *'    # 10:18 IST
    - cron: '0 6 * * *'     # 11:30 IST
    - cron: '12 7 * * *'    # 12:42 IST
    - cron: '24 8 * * *'    # 13:54 IST
    - cron: '36 9 * * *'    # 15:06 IST
    - cron: '48 10 * * *'   # 16:18 IST
    - cron: '0 12 * * *'    # 17:30 IST
    - cron: '12 16 * * *'   # 18:42 IST
    - cron: '24 14 * * *'   # 19:54 IST
    - cron: '36 15 * * *'   # 21:06 IST
    - cron: '48 16 * * *'   # 22:18 IST
    - cron: '0 18 * * *'    # 23:30 IST
    - cron: '12 19 * * *'   # 00:42 IST
    - cron: '24 20 * * *'   # 01:54 IST
    - cron: '36 21 * * *'   # 03:06 IST
    - cron: '48 22 * * *'   # 04:18 IST

  workflow_dispatch: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API Health Suite (auto-emails dashboard)
        env:
          HEALTH_BASE_URL: ${{ secrets.HEALTH_BASE_URL }}
          HEALTH_USER_USERNAME: ${{ secrets.HEALTH_USER_USERNAME }}
          HEALTH_USER_PASSWORD: ${{ secrets.HEALTH_USER_PASSWORD }}
          EMAIL_PROVIDER: "resend"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          HEALTH_MAIL_FROM: ${{ secrets.HEALTH_MAIL_FROM }}
          HEALTH_MAIL_TO: ${{ secrets.HEALTH_MAIL_TO }}
        run: |
          pytest test/health -q --junitxml=junit-health.xml
        continue-on-error: true

      - name: Upload report + failure logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-health-report-${{ github.run_id }}
          path: |
            junit-health.xml
            **/api_health_report.xlsx
            **/api_failures/**
          retention-days: 30