name: API Health Check (5x Daily)

on:
  schedule:
    # 5 runs/day, spread across working hours. All times UTC — adjust to
    # your actual preferred IST times: subtract 5:30 from IST to get UTC.
    - cron: '0 3 * * *'    # 08:30 IST
    - cron: '0 6 * * *'    # 11:30 IST
    - cron: '0 9 * * *'    # 14:30 IST
    - cron: '0 12 * * *'   # 17:30 IST
    - cron: '0 15 * * *'   # 20:30 IST
  workflow_dispatch: {}    # manual trigger anytime from the Actions tab

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API Health Suite (auto-emails dashboard)
        env:
          BASE_URL: ${{ secrets.HEALTH_BASE_URL }}
          HEALTH_USER_USERNAME: ${{ secrets.HEALTH_USER_USERNAME }}
          HEALTH_USER_PASSWORD: ${{ secrets.HEALTH_USER_PASSWORD }}
          EMAIL_PROVIDER: "resend"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          HEALTH_MAIL_FROM: ${{ secrets.HEALTH_MAIL_FROM }}
          HEALTH_MAIL_TO: ${{ secrets.HEALTH_MAIL_TO }}
        run: |
          pytest test/health -q --junitxml=junit-health.xml
        continue-on-error: true   # don't block artifact upload if tests fail

      - name: Upload report + failure logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-health-report-${{ github.run_id }}
          path: |
            junit-health.xml
            **/api_health_report.xlsx
            **/api_failures/**
          retention-days: 30
